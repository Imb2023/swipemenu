<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>Menu</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CDN (fast MVP). For bigger scale, swap to Tailwind build later. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ["Outfit", "ui-sans-serif", "system-ui", "-apple-system", "sans-serif"],
          },
          boxShadow: {
            premium: "0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05)",
            glass: "inset 0 1px 1px rgba(255,255,255,0.1), 0 10px 30px rgba(0,0,0,0.4)",
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --bg: #050507;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-hover: rgba(255, 255, 255, 0.07);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.5);
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.15);
    }

    body {
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 50% -20%, var(--accent-glow), transparent 70%),
        radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.03), transparent 40%);
      color: var(--text);
      min-height: 100vh;
      letter-spacing: -0.01em;
    }

    /* Smooth transitions */
    * {
      transition: background-color 0.3s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, opacity 0.3s ease;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .item-appear {
      animation: appear 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="font-sans antialiased text-white">
  <div class="min-h-screen">
    <!-- Header -->
    <header class="safe-top sticky top-0 z-30">
      <div class="glass border-b border-white/5 bg-black/40">
        <div class="mx-auto max-w-xl px-6 py-5">
          <div class="flex flex-col items-center text-center gap-4">
            <img id="brandLogo" src="./logo.png" alt="Logo"
              class="h-16 w-16 rounded-2xl object-cover shadow-premium ring-1 ring-white/10" />
            <div class="space-y-1">
              <h1 id="brandName" class="text-xl font-bold tracking-tight">
                Your Restaurant
              </h1>
              <p id="brandTagline" class="text-xs text-white/40 uppercase tracking-[0.2em] font-medium">
                Tap an item for details
              </p>
              <div id="statusPill"
                class="hidden inline-block mt-2 text-[10px] px-2 py-0.5 rounded-full bg-accent/20 border border-accent/30 text-accent">
                Updated
              </div>
            </div>
          </div>

          <!-- Category tabs -->
          <div class="mt-8">
            <div id="categoryRow" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar scroll-smooth">
              <!-- injected -->
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main class="mx-auto max-w-xl px-6 pb-32 pt-10 safe-bottom">
      <!-- Specials -->
      <section id="specialsSection" class="hidden mb-12">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-lg font-bold tracking-tight flex items-center gap-2">
            <span class="text-orange-500 text-xl">✦</span> Today's Specials
          </h2>
        </div>
        <div id="specialsGrid" class="grid gap-4"></div>
      </section>

      <!-- Menu list -->
      <section>
        <div class="flex items-center justify-between mb-6">
          <h2 id="menuTitle" class="text-lg font-bold tracking-tight">
            Menu
          </h2>
          <span id="countLabel" class="text-xs font-medium text-white/30 uppercase tracking-widest"></span>
        </div>

        <div id="menuList" class="grid gap-3"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden mt-20 text-center py-10 glass rounded-3xl">
          <p class="text-sm font-semibold opacity-60">No items found</p>
        </div>
      </section>
    </main>

    <!-- Bottom sheet modal -->
    <div id="modalOverlay" class="fixed inset-0 z-40 hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-black/80 backdrop-blur-md" data-close="true"></div>

      <div class="absolute inset-x-0 bottom-0 mx-auto max-w-xl px-4 pb-10 safe-bottom">
        <div id="modalPanel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"
          class="glass rounded-[2.5rem] shadow-premium overflow-hidden border-t border-white/10">
          <div class="relative">
            <div id="modalImageWrap" class="hidden h-64 relative">
              <img id="modalImage" alt="" class="w-full h-full object-cover" />
              <div class="absolute inset-0 bg-gradient-to-t from-[#050507] via-transparent to-transparent"></div>
            </div>

            <button id="modalClose" type="button"
              class="absolute top-4 right-4 z-10 w-10 h-10 flex items-center justify-center rounded-full glass hover:bg-white/10 text-white"
              aria-label="Close">
              ✕
            </button>

            <div class="p-8">
              <div class="flex flex-col gap-1 mb-6">
                <span id="modalCategory"
                  class="text-[10px] font-bold uppercase tracking-[0.2em] text-orange-500"></span>
                <h3 id="modalTitle" class="text-2xl font-bold tracking-tight"></h3>
              </div>

              <div class="space-y-6">
                <div class="flex items-center justify-between">
                  <p id="modalPrice" class="text-2xl font-light"></p>
                  <span id="modalBadge"
                    class="hidden px-3 py-1 rounded-full bg-white/5 border border-white/10 text-[10px] font-bold uppercase tracking-wider text-white/60"></span>
                </div>

                <p id="modalDesc" class="text-base text-white/60 leading-relaxed font-light"></p>
              </div>

              <div class="mt-10 flex gap-3">
                <button id="modalCopyBtn" type="button"
                  class="flex-1 h-14 rounded-2xl glass font-semibold text-sm hover:bg-white/10 active:scale-95">
                  Copy Name
                </button>
                <button id="modalDoneBtn" type="button"
                  class="flex-1 h-14 rounded-2xl bg-white text-black font-bold text-sm hover:bg-white/90 active:scale-95">
                  Close
                </button>
              </div>

              <p id="toast" class="mt-4 text-center text-xs font-medium text-orange-500 hidden"></p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading bar -->
    <div id="loadingBar"
      class="fixed left-0 top-0 z-50 h-[3px] w-0 bg-orange-500 shadow-[0_0_15px_rgba(249,115,22,0.8)]"></div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => { });
      });
    }
  </script>
</body>

</html>
