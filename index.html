<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0d" />
  <title>My Specials</title>

  <link rel="icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg: #0b0b0d;
      --accent: #f97316;
      --accent2: #fb923c;
    }

    body {
      background:
        radial-gradient(900px 600px at 50% -10%, rgba(249, 115, 22, .12), transparent 60%),
        radial-gradient(700px 500px at 10% 10%, rgba(255, 255, 255, .05), transparent 60%),
        var(--bg);
      color: rgba(255, 255, 255, .92);
    }

    .safe-top {
      padding-top: env(safe-area-inset-top);
    }

    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* full-screen card snapping */
    .snap-y-mandatory {
      scroll-snap-type: y mandatory;
    }

    .snap-start {
      scroll-snap-align: start;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* subtle float for the swipe hint */
    @keyframes floaty {

      0%,
      100% {
        transform: translateY(0);
        opacity: .55;
      }

      50% {
        transform: translateY(6px);
        opacity: .9;
      }
    }

    .floaty {
      animation: floaty 1.6s ease-in-out infinite;
    }
  </style>
</head>

<body class="antialiased">
  <div class="min-h-dvh">
    <!-- Minimal top bar (tiny, modern) -->
    <header class="safe-top sticky top-0 z-30">
      <div class="backdrop-blur-xl bg-black/25 border-b border-white/10">
        <div class="mx-auto max-w-xl px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <img id="brandLogo" src="logo.png" alt="Logo"
              class="h-8 w-8 rounded-xl object-cover ring-1 ring-white/10" />
            <div class="min-w-0">
              <p id="brandName" class="text-sm font-semibold tracking-tight truncate">
                Today’s Specials
              </p>
              <p id="brandSub" class="text-[11px] text-white/60 truncate">
                Swipe to view
              </p>
            </div>
          </div>

          <span id="statusPill"
            class="hidden text-[11px] px-2 py-0.5 rounded-full bg-white/10 border border-white/10 text-white/70">
            Updated
          </span>
        </div>
      </div>
    </header>

    <!-- Fullscreen Specials Carousel (vertical) -->
    <main class="mx-auto max-w-xl">
      <div id="deck" class="h-[calc(100dvh-56px)] safe-bottom overflow-y-auto no-scrollbar snap-y-mandatory">
        <!-- injected cards -->
      </div>

      <!-- Dots -->
      <div class="fixed inset-x-0 bottom-4 z-40 safe-bottom">
        <div class="mx-auto max-w-xl px-4 flex items-center justify-center">
          <div id="dots"
            class="flex items-center gap-2 rounded-full border border-white/10 bg-black/25 backdrop-blur px-3 py-2">
            <!-- injected -->
          </div>
        </div>
      </div>

      <!-- Swipe hint (auto hides after interaction) -->
      <div id="swipeHint" class="fixed inset-x-0 bottom-16 z-40 pointer-events-none">
        <div class="mx-auto max-w-xl px-4 flex justify-center">
          <div class="floaty text-xs text-white/70">
            ↑ swipe for next special
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom sheet modal (details) -->
    <div id="modalOverlay" class="fixed inset-0 z-50 hidden" aria-hidden="true">
      <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" data-close="true"></div>

      <div class="absolute inset-x-0 bottom-0 mx-auto max-w-xl px-4 pb-4 safe-bottom">
        <div class="rounded-3xl border border-white/10 bg-[#121218]/95 shadow-2xl overflow-hidden" role="dialog"
          aria-modal="true">
          <div class="p-4">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h3 id="modalTitle" class="text-base font-semibold tracking-tight">Item</h3>
                <p id="modalMeta" class="mt-0.5 text-xs text-white/60"></p>
              </div>
              <button id="modalClose" type="button"
                class="rounded-2xl bg-white/5 border border-white/10 px-3 py-2 text-sm text-white/80 hover:bg-white/10">
                ✕
              </button>
            </div>

            <div class="mt-3">
              <div class="flex items-baseline justify-between gap-3">
                <p id="modalPrice" class="text-lg font-semibold"></p>
                <span id="modalBadge"
                  class="text-[11px] px-2 py-0.5 rounded-full bg-white/10 border border-white/10 text-white/70"></span>
              </div>
              <p id="modalDesc" class="mt-2 text-sm text-white/70"></p>
            </div>

            <div id="modalImageWrap" class="hidden mt-4">
              <img id="modalImage" alt="" class="w-full h-44 rounded-2xl object-cover ring-1 ring-white/10" />
            </div>

            <div class="mt-4 flex gap-2">
              <button id="modalCopyBtn" type="button"
                class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm font-semibold text-white/90 hover:bg-white/10 active:scale-[0.99]">
                Copy name
              </button>
              <button id="modalDoneBtn" type="button"
                class="flex-1 rounded-2xl px-4 py-3 text-sm font-semibold active:scale-[0.99]"
                style="background: linear-gradient(90deg, var(--accent), var(--accent2)); color: rgba(0,0,0,.92);">
                Done
              </button>
            </div>

            <p id="toast" class="mt-3 hidden text-xs text-white/60"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tiny loading bar -->
    <div id="loadingBar" class="fixed left-0 top-0 z-[60] h-[2px] w-0"
      style="background: linear-gradient(90deg, var(--accent), var(--accent2));"></div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => { });
      });
    }
  </script>
</body>

</html>
