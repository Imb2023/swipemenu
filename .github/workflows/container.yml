name: Publish IsmaSigns Specials container

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test application and standalone server
        run: npm test
      - name: Build and smoke-test native container
        run: |
          docker build -t ismasigns-specials:check .
          docker run -d --name specials-check --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:3000:3000 ismasigns-specials:check
          trap 'docker logs specials-check; docker rm -f specials-check' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS http://127.0.0.1:3000/setup.html > /dev/null
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ismasigns-specials" >> "$GITHUB_ENV"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - name: Publish AMD64 and ARM64 images
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record sharing instructions
        run: |
          echo "Image: \`$IMAGE:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo 'For anonymous pulls, the package owner must set its visibility to Public under GitHub Packages → Package settings.' >> "$GITHUB_STEP_SUMMARY"
